openapi: 3.0.4
info:
  title: Subdomain Finder
  description: >-
    Subdomain Finder discovers active subdomains and their resolved IP addresses
    for any target domain. It checks certificate transparency logs and common
    hostnames, returning matched hostnames, root A records, and scan completion
    status.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/subdomainfinder:
    get:
      summary: Subdomain Finder
      description: >-
        Subdomain Finder is a simple tool for finding all the available
        subdomains for a given domain. It returns a list of all the available
        subdomains for the given domain.
      operationId: subdomainfinder
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          required: true
          description: >-
            The domain you want to find all the available subdomains for (e.g.
            google.com)
          example: google.com
        - name: limit
          in: query
          schema:
            type: integer
          required: false
          description: Limit the number of subdomains to detect
          example: 5
        - name: deepScan
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Search the full wordlist instead of only certificate transparency
            and common names. Slower, and may still report complete: false when
            the time limit is reached
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
